# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Build the dev branch into docs/dev/ so it is served at <url>/dev/
      PKGDOWN_DEV_MODE: ${{ github.ref_name == 'dev' && 'devel' || 'default' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::DT local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy main site to GitHub pages 🚀
        if: github.event_name != 'pull_request' && github.ref_name != 'dev'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          clean-exclude: dev
          branch: gh-pages
          folder: docs

      - name: Deploy dev site to GitHub pages 🚀
        if: github.event_name != 'pull_request' && github.ref_name == 'dev'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: docs/dev
          target-folder: dev
