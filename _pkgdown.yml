url: https://ptompalski.github.io/RSYC
destination: "docs"
template:
  bootstrap: 5
  math-rendering: mathjax

navbar:
  structure:
    left: [intro, reference, articles, explorer, tutorials, news]
  components:
    explorer:
      text: Curve explorer
      href: articles/curve-explorer.html

reference:
- title: Predict yield and build datasets
  desc: Estimate yield curves and combine predictions with spatial data.
  contents:
  - predict_rsyc
  - calibrate_rsyc
  - build_rsyc_dataset

- title: Discover available models
  desc: Find published curves, species, and geographic strata.
  contents:
  - available_rsyc_models
  - rsyc_species
  - rsyc_strata
  - species_codes

- title: Access spatial boundaries
  desc: Download and read the polygons associated with RSYC models.
  contents:
  - rsyc_boundaries
  - download_rsyc_boundaries

- title: Package datasets
  desc: Model metadata and the bundled tile grid.
  contents:
  - RSYC_models
  - RSYC_tiles

articles:
- title: Using RSYC
  navbar: ~
  contents:
  - articles/Prediction-examples
  - articles/Local-calibration
  - articles/Model-parameters

- title: Explore curves
  navbar: ~
  desc: Browse published curves on a map, with their parameters and validation results.
  contents:
  - articles/curve-explorer

- title: Validation
  navbar: Validation
  desc: How well RSYC curves agree with independent ground plots.
  contents:
  - articles/validation
